# =============================================================================
# RustDesk Windows x64 云编译工作流（定制版）
# =============================================================================
#
# 使用方式：
#   1. 放入 .github/workflows/ 目录
#   2. Settings → Actions → General → Read and write permissions
#      勾选 Allow GitHub Actions to create and approve pull requests
#   3. Actions 页手动 Run workflow，或推送 v* tag 自动触发
#
# 已知修复：
#   - bridge 生成用 Flutter 3.22.3 + extended_text 降级到 13.0.0
#   - RustDeskTempTopMostWindow 从独立仓库 clone
#   - vcpkg 实时输出（不缓冲）
#   - 托盘注入用 bash+python 避免 PowerShell 转义/编码问题
#   - Flutter 引擎目录自动创建
#   - Rust 1.81 兼容最新源码
# =============================================================================

name: Build RustDesk Windows x64

on:
  workflow_dispatch:
    inputs:
      # ── 基础选项 ──
      upload_release:
        description: "上传到 Release"
        type: boolean
        default: true
      tag_name:
        description: "Release 标签名"
        type: choice
        default: "master"
        options:
          - master
          - master-sos
      rustdesk_version:
        description: "RustDesk 源码 tag（如 1.5.1，留空用 master）"
        type: string
        default: ""

      # ── 服务器定制 ──
      custom_server:
        description: "统一服务器地址（自动应用到 ID/中继/API，不加 http://）"
        type: string
        default: ""
      custom_public_key:
        description: "服务器公钥"
        type: string
        default: ""
      custom_fixed_password:
        description: "固定密码"
        type: string
        default: ""

      # ── 端口定制 ──
      custom_id_port:
        description: "ID 服务器端口（留空默认 21116）"
        type: string
        default: ""
      custom_relay_port:
        description: "中继服务器端口（留空默认 21117）"
        type: string
        default: ""

      # ── 权限选项 ──
      allow_remote_config:
        description: "允许远程修改配置"
        type: boolean
        default: false
      hide_connection_window:
        description: "隐藏连接管理窗口"
        type: boolean
        default: false
      enable_sos_mode:
        description: "启用 SOS 版本"
        type: boolean
        default: false

      # ── 托盘选项 ──
      hide_tray_icon:
        description: "隐藏系统托盘图标"
        type: boolean
        default: true
      disable_tray_startup:
        description: "禁止开机自启"
        type: boolean
        default: false

  push:
    tags:
      - "v*"

# ─── 环境变量 ───────────────────────────────────────────────────────────────
env:
  RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

permissions:
  contents: write
  actions: read

# =============================================================================
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: 生成 Flutter-Rust Bridge
  # ───────────────────────────────────────────────────────────────────────────
  generate-bridge:
    name: Generate Bridge
    runs-on: ubuntu-22.04
    env:
      CARGO_EXPAND_VERSION: "1.0.95"
      BRIDGE_FLUTTER_VERSION: "3.22.3"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rustdesk_version || '' }}

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc g++ git \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu

      - uses: actions/cache@v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install codegen tools
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked

      - name: Flutter pub get
        shell: bash
        run: |
          # 降级 extended_text 以兼容 Dart 3.4.4（Flutter 3.22.3）
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generate bridge files
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: 编译 RustDeskTempTopMostWindow（独立仓库）
  # ───────────────────────────────────────────────────────────────────────────
  build-topmost-window:
    name: Build TopMostWindow
    runs-on: windows-2022
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/x64/Release
    steps:
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Clone and build
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - uses: actions/upload-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./${{ env.build_output_dir }}/WindowInjection.dll

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: 编译 RustDesk Windows x64
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build RustDesk Windows x64
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:

      # ── 环境变量 ──
      - uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ── 拉取源码 ──
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rustdesk_version || '' }}

      # ── 恢复 Bridge ──
      - uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      # ==================================================================
      # ▼▼▼ 定制参数注入 ▼▼▼
      # ==================================================================

      # ── 注入服务器配置（纯 sed，不用 Python）──
      - name: Inject server config
        if: |
          (github.event_name == 'workflow_dispatch' &&
           (inputs.custom_server != '' ||
            inputs.custom_id_server != '' ||
            inputs.custom_relay_server != '' ||
            inputs.custom_api_server != '' ||
            inputs.custom_public_key != '' ||
            inputs.custom_fixed_password != '' ||
            inputs.custom_id_port != '' ||
            inputs.custom_relay_port != ''))
        shell: bash
        run: |
          UNI_SERVER="${{ github.event_name == 'workflow_dispatch' && inputs.custom_server || '' }}"
          ID_SERVER="${{ github.event_name == 'workflow_dispatch' && inputs.custom_id_server || '' }}"
          RELAY_SERVER="${{ github.event_name == 'workflow_dispatch' && inputs.custom_relay_server || '' }}"
          API_SERVER="${{ github.event_name == 'workflow_dispatch' && inputs.custom_api_server || '' }}"
          PUBLIC_KEY="${{ github.event_name == 'workflow_dispatch' && inputs.custom_public_key || '' }}"
          FIXED_PWD="${{ github.event_name == 'workflow_dispatch' && inputs.custom_fixed_password || '' }}"
          ID_PORT="${{ github.event_name == 'workflow_dispatch' && inputs.custom_id_port || '' }}"
          RELAY_PORT="${{ github.event_name == 'workflow_dispatch' && inputs.custom_relay_port || '' }}"

          # 统一地址回退
          [ -n "$UNI_SERVER" ] && [ -z "$ID_SERVER" ] && ID_SERVER="$UNI_SERVER"
          [ -n "$UNI_SERVER" ] && [ -z "$RELAY_SERVER" ] && RELAY_SERVER="$UNI_SERVER"
          [ -n "$UNI_SERVER" ] && [ -z "$API_SERVER" ] && API_SERVER="http://${UNI_SERVER}:21114"

          echo "=== Inject server config ==="
          echo "ID_SERVER=$ID_SERVER"
          echo "RELAY_SERVER=$RELAY_SERVER"
          echo "API_SERVER=$API_SERVER"
          echo "PUBLIC_KEY=$PUBLIC_KEY"
          echo "FIXED_PWD=$FIXED_PWD"
          echo "ID_PORT=$ID_PORT"
          echo "RELAY_PORT=$RELAY_PORT"

          # 修改 config.rs
          CONFIG_RS="libs/hbb_common/src/config.rs"
          if [ -f "$CONFIG_RS" ]; then
            [ -n "$ID_SERVER" ] && sed -i 's|pub const RENDEZVOUS_SERVERS.*|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&["'$ID_SERVER'"];|' "$CONFIG_RS" && echo "[OK] ID Server"
            [ -n "$ID_PORT" ] && sed -i 's|pub const RENDEZVOUS_PORT.*|pub const RENDEZVOUS_PORT: i32 = '$ID_PORT';|' "$CONFIG_RS" && echo "[OK] ID Port"
            [ -n "$RELAY_PORT" ] && sed -i 's|pub const RELAY_PORT.*|pub const RELAY_PORT: i32 = '$RELAY_PORT';|' "$CONFIG_RS" && echo "[OK] Relay Port"
            [ -n "$PUBLIC_KEY" ] && sed -i 's|pub const RS_PUB_KEY.*|pub const RS_PUB_KEY: \&str = "'$PUBLIC_KEY'";|' "$CONFIG_RS" && echo "[OK] Public Key"
          fi

          # 修改 main.dart（在 startService 后插入配置代码）
          MAIN_DART="flutter/lib/main.dart"
          if [ -f "$MAIN_DART" ]; then
            INJECT_CODE="    // === Injected config ==="
            [ -n "$FIXED_PWD" ] && INJECT_CODE="$INJECT_CODE\n    bind.mainSetPermanentPasswordWithResult(password: \"$FIXED_PWD\");"
            [ -n "$RELAY_SERVER" ] && INJECT_CODE="$INJECT_CODE\n    bind.mainSetOption(key: \"relay-server\", value: \"$RELAY_SERVER\");"
            [ -n "$API_SERVER" ] && INJECT_CODE="$INJECT_CODE\n    bind.mainSetOption(key: \"api-server\", value: \"$API_SERVER\");"
            INJECT_CODE="$INJECT_CODE\n    // === End injected ==="

            sed -i "/gFFI.serverModel.startService();/a\\$INJECT_CODE" "$MAIN_DART"
            echo "[OK] main.dart injected"
          fi

          # 验证
          echo "=== Verification ==="
          grep "RENDEZVOUS_SERVERS" "$CONFIG_RS" | head -1
          grep "RENDEZVOUS_PORT" "$CONFIG_RS" | head -1
          grep "RELAY_PORT" "$CONFIG_RS" | head -1
          grep "RS_PUB_KEY" "$CONFIG_RS" | head -1
          grep -A5 "startService" "$MAIN_DART" | head -8

      # ── 注入权限选项 ──
      - name: Inject permissions
        if: |
          (github.event_name == 'workflow_dispatch' &&
           (inputs.allow_remote_config ||
            inputs.hide_connection_window ||
            inputs.enable_sos_mode))
        shell: pwsh
        env:
          ALLOW_REMOTE_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_remote_config || 'false' }}
          HIDE_CONN_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.hide_connection_window || 'false' }}
          ENABLE_SOS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_sos_mode || 'false' }}
        run: |
          $allowRemoteConfig = $env:ALLOW_REMOTE_CONFIG
          $hideConnWindow = $env:HIDE_CONN_WINDOW
          $enableSos = $env:ENABLE_SOS

          $optFile = "src/server/connection.rs"
          if (Test-Path $optFile) {
            $c = Get-Content $optFile -Raw -Encoding UTF8
            if ($allowRemoteConfig -eq "true") {
              $c = $c -replace '(OPTION_ALLOW_REMOTE_CONFIG.*?)false', '${1}true'
            }
            if ($hideConnWindow -eq "true") {
              $c = $c -replace '(OPTION_HIDE_CONN_WINDOW.*?)false', '${1}true'
            }
            if ($enableSos -eq "true") {
              $c = $c -replace '(OPTION_ENABLE_SOS.*?)false', '${1}true'
            }
            Set-Content $optFile -Value $c -Encoding UTF8
          }

      # ── 注入托盘选项（bash + python 避免 PowerShell 转义/编码问题）──
      - name: Inject tray options
        if: |
          (github.event_name == 'workflow_dispatch' &&
           (inputs.hide_tray_icon ||
            inputs.disable_tray_startup))
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          HIDE_TRAY="${{ github.event_name == 'workflow_dispatch' && inputs.hide_tray_icon || 'false' }}"
          DISABLE_STARTUP="${{ github.event_name == 'workflow_dispatch' && inputs.disable_tray_startup || 'false' }}"

          echo "========== Inject tray options =========="

          WIN_FILE="src/platform/windows.rs"

          # 1. 禁止开机自启
          if [ "$DISABLE_STARTUP" = "true" ] || [ "$HIDE_TRAY" = "true" ]; then
            if [ -f "$WIN_FILE" ]; then
              python3 << 'PYEOF'
          import re
          with open("src/platform/windows.rs", "r", encoding="utf-8") as f:
              content = f.read()
          pattern = r'let tray_shortcuts = if config::is_outgoing_only\(\).*?;\n'
          replacement = 'let tray_shortcuts = String::new();\n'
          content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          with open("src/platform/windows.rs", "w", encoding="utf-8") as f:
              f.write(content)
          print("  [Startup] disabled")
          PYEOF
            fi
          fi

          # 2. 隐藏运行时托盘
          if [ "$HIDE_TRAY" = "true" ]; then
            if [ -f "$WIN_FILE" ]; then
              python3 << 'PYEOF'
          import re
          with open("src/platform/windows.rs", "r", encoding="utf-8") as f:
              content = f.read()

          hide_code = '''
          // [Injected] Set hide-tray in registry
          {
              let cmd = format!("chcp 65001 && reg add HKEY_LOCAL_MACHINE\\\\Software\\\\{} /f /v hide-tray /t REG_SZ /d \\"Y\\"", app_name);
              let _ = run_cmds(cmd, false, "hide_tray");
          }
          '''
          pattern = r'(run_cmds\(\s*InstallCommands)'
          content = re.sub(pattern, lambda m: hide_code + "\n          " + m.group(1), content, count=1)
          with open("src/platform/windows.rs", "w", encoding="utf-8") as f:
              f.write(content)
          print("  [Hide Tray] registry injected")
          PYEOF
            fi

            # 3. Flutter 端隐藏托盘
            MAIN_DART="flutter/lib/main.dart"
            if [ -f "$MAIN_DART" ]; then
              python3 << 'PYEOF'
          with open("flutter/lib/main.dart", "r", encoding="utf-8") as f:
              content = f.read()
          inject = '''      // [Injected] Hide tray icon at runtime
                try { await bind.mainSetLocalOption(key: 'hide-tray', value: 'Y'); } catch (_) {}
          '''
          content = content.replace('windowManager.setOpacity(1);', inject + 'windowManager.setOpacity(1);', 1)
          with open("flutter/lib/main.dart", "w", encoding="utf-8") as f:
              f.write(content)
          print("  [Flutter] tray hidden")
          PYEOF
            fi
          fi

          echo "========== Done =========="

      # ==================================================================
      # ▲▲▲ 定制参数注入结束 ▲▲▲
      # ==================================================================

      # ── 安装 LLVM ──
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      # ── 安装 Flutter ──
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # ── 替换 RustDesk 定制引擎 ──
      - name: Replace Flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release"
          if (-not (Test-Path $engineDir)) {
            New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          }
          Move-Item -Force windows-x64-release/* $engineDir

      # ── 应用 Flutter 补丁 ──
      - name: Patch Flutter
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR/" 2>/dev/null || true
          cd "$FLUTTER_DIR"
          if [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff 2>/dev/null || echo "Patch skipped"
          fi

      # ── 安装 Rust 工具链 ──
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      # ── vcpkg ──
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          & $env:VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$env:VCPKG_ROOT/installed"
          if (-not $?) {
            Write-Host "vcpkg failed, dumping logs..."
            Get-ChildItem -Path "$env:VCPKG_ROOT/" -Recurse -Filter "*.log" | ForEach-Object {
              Write-Host "$($_.FullName):"
              Write-Host "======"
              Get-Content $_.FullName
              Write-Host "======"
            }
            exit 1
          }

      # ── 编译 RustDesk ──
      - name: Build RustDesk
        shell: pwsh
        run: |
          $buildArgs = "--portable --flutter --skip-portable-pack"

          $hwcodec = "${{ github.event_name == 'workflow_dispatch' && inputs.enable_hwcodec || 'false' }}"
          if ($hwcodec -eq "true") { $buildArgs += " --hwcodec" }

          $vram = "${{ github.event_name == 'workflow_dispatch' && inputs.enable_vram || 'false' }}"
          if ($vram -eq "true") { $buildArgs += " --vram" }

          Write-Host "Build: python3 .\build.py $buildArgs"
          Invoke-Expression "python3 .\build.py $buildArgs"

          Move-Item ./flutter/build/windows/x64/runner/Release ./rustdesk

      # ── 下载虚拟显示器驱动 ──
      - name: Download virtual display driver
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          Move-Item -Force .\usbmmidd_v2 ./rustdesk

      # ── 下载打印驱动 ──
      - name: Download printer driver
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
          $cd = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $dd = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $ca = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $da = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($cd -eq $dd.Hash -and $ca -eq $da.Hash) {
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            New-Item -ItemType Directory -Force ./rustdesk/drivers | Out-Null
            Move-Item -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
            Expand-Archive printer_driver_adapter.zip -DestinationPath .
            Move-Item -Force .\printer_driver_adapter.dll ./rustdesk
          }

      # ── 下载置顶窗口组件 ──
      - uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # ── 查找 Runner.res ──
      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      # ── 上传未签名构建 ──
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-unsigned-windows-x86_64
          path: rustdesk

      # ── 构建自解压安装包 ──
      - name: Build self-extracted EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      # ── 上传安装包 ──
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-${{ env.VERSION }}-x86_64.exe
          path: ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      # ── 发布到 Release ──
      - name: Publish to Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_release)
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: |
            ./SignOutput/rustdesk-*.exe
